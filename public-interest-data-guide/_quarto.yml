project:
  type: website

website:
  title: "Public Interest Data Guide"
  page-navigation: true
  repo-url: https://github.com/rapid-community-data-lab/rapid-data-guide
  repo-subdir: public-interest-data-guide
  repo-actions: [edit, source, issue]
  draft-mode: visible
  navbar:
    logo: /images/rapid-logo.jpg
  sidebar:
    style: floating
    contents:
      - href: index.ipynb
        text: Home
      - href: about.ipynb
        text: About
      - section: Hansard
        contents:
          - hansard/hansard-intro.ipynb
          - hansard/hansard-contents.ipynb
          - hansard/parliamentary-processes.ipynb
          - hansard/hansard-structure.ipynb
          - hansard/parliamentarians.ipynb
          - section: Related resources
            contents:
              - hansard/resources/parliamentary-handbook-api.ipynb
              - hansard/resources/other-resources.ipynb
          - section: Tutorials
            contents:
              - hansard/tutorials/intro-language-parliament.ipynb
              - hansard/tutorials/aliens-and-immigrants.ipynb
          - section: How to
            contents:
              - hansard/how-to/compile-dataset.ipynb
      - section: Inquiries
        contents:
          - inquiries/inquiries-intro.ipynb
      - section: Contributing
        contents:
          - contributing/contributing.ipynb
          - contributing/author-guide.ipynb
  page-footer:
    center: "Part of the [RAPID-CDL](https://rapid-cdl.edu.au) (Reusable and Accessible Public Interest Documents) project"


format:
  html:
    theme:
      light: flatly
      dark: darkly
    css: styles.css
    toc: true
    #link-external-icon: true
    #link-external-newwindow: true

profile:
  group: 
    - [dev, prod]

execute:
  freeze: auto

